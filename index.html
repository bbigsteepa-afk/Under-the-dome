<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<title>John Q | MovieFlickz1</title>

<style>
:root{
  --bg:#07090e;
  --panel:#11141d;
  --muted:#aeb5c2;
  --red:#e50914;
  --white:#f7f8fb;
  --line:rgba(255,255,255,.12);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.6;
}

a{
  color:inherit;
  text-decoration:none;
}

.wrap{
  width:min(1180px,92%);
  margin:auto;
}

/* NAVBAR */

header{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  position:relative;
  z-index:10;
  background:#08090df2;
}

.brand{
  font-size:1.55rem;
  font-weight:900;
  letter-spacing:-1px;
}

.brand span{
  color:var(--red);
}

.tagline{
  font-size:.72rem;
  color:#aeb5c2;
  margin-top:-7px;
}

nav{
  display:flex;
  align-items:center;
  gap:25px;
  font-size:.9rem;
  color:#e2e5eb;
}

nav a:hover{
  color:#ff3540;
}

.follow{
  background:var(--red);
  padding:9px 19px;
  border-radius:999px;
  font-weight:700;
}

/* HERO */

.hero{
  min-height:650px;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;

  background:
  radial-gradient(
    ellipse at 75% 43%,
    rgba(185,87,35,.48),
    transparent 30%
  ),
  radial-gradient(
    ellipse at 80% 70%,
    rgba(104,54,28,.4),
    transparent 36%
  ),
  linear-gradient(
    90deg,
    #08090e 0%,
    rgba(8,9,14,.96) 32%,
    rgba(8,9,14,.5) 70%,
    rgba(8,9,14,.8) 100%
  ),
  linear-gradient(
    135deg,
    #24202a,
    #0b1018 55%,
    #44251b
  );
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      0deg,
      var(--bg),
      transparent 24%,
      transparent 75%,
      rgba(0,0,0,.2)
    );
  pointer-events:none;
}

.hero-art{
  position:absolute;
  right:2%;
  top:0;
  height:100%;
  width:55%;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:.95;
}

.silhouette{
  height:94%;
  width:min(460px,100%);
  position:relative;
  filter:drop-shadow(0 18px 45px #000);
}

    9% 23%
  );
